# Infrastructure distribution configuration
#
# This file defines which repositories receive infrastructure updates
# from @diplodoc/infra and per-repo exclusion rules.
#
# Synced automatically from metapackage .gitmodules via sync-packages-list.yml.
# Manual edits to blacklist/auto_merge settings are preserved during sync.
#
# Exclusion formats:
#   - .github/workflows/tests.yml          # exact path
#   - .github/workflows/*.yml              # glob pattern
#   - .github/workflows/                   # entire directory
#   - path: .github/workflows/tests.yml    # extended format
#     reason: "Custom workflow"             # why it's excluded
#     until: "2026-07-01"                  # auto-expires after this date

defaults:
  auto_merge: true
  exclude: []

# CI gate configuration (Ruleset A "master CI gate", see ADR-002).
# The sync-ci-gate workflow discovers each repo's actual CI status-check contexts
# from the HEAD commit of its default branch and points the ruleset at them.
# `exclude_checks` removes contexts that are NOT guaranteed to report on every PR
# (conditional / non-PR / scheduled workflows) so a PR never blocks forever.
# Glob patterns: `*` matches any run of characters.
# Per-repo override is supported via repos.<name>.ci_gate.{ruleset_name,exclude_checks,required_checks}.
ci_gate:
  ruleset_name: 'master CI gate'
  exclude_checks:
    - 'coverage*' # coverage.yml — runs only when test:coverage exists
    - 'SonarCloud*' # sonarcloud.yml — runs only when coverage was generated
    - 'release-please*' # release-please.yml — release PRs, not a PR gate
    - 'Update Dependencies*' # update-deps.yml — manual dispatch
    - 'package-lock*' # package-lock.yml — not a PR gate
    - 'Distribute*' # distribution workflow checks (infra repo only)

repos:
  # === packages ===
  cli:
    exclude: []
  client:
    exclude: []
  components:
    exclude: []
  directive:
    exclude: []
  liquid:
    exclude: []
  sentenizer:
    exclude: []
  transform:
    exclude: []
  translation:
    exclude: []
  utils:
    exclude: []
  yfmlint:
    exclude: []

  # === extensions ===
  algolia-extension:
    exclude: []
  color-extension:
    exclude: []
  cut-extension:
    exclude: []
  file-extension:
    exclude: []
  folding-headings-extension:
    exclude: []
  html-extension:
    exclude: []
  latex-extension:
    exclude: []
  mermaid-extension:
    exclude: []
  openapi-extension:
    exclude: []
  page-constructor-extension:
    exclude: []
  quote-link-extension:
    exclude: []
  search-extension:
    exclude: []
  tabs-extension:
    exclude: []

  # === devops ===
  babel-preset:
    auto_merge: false
    exclude: []
  package-template:
    exclude: []
  tsconfig:
    auto_merge: false
    exclude: []
  testpack:
    auto_merge: false
    exclude: []
  vsc:
    exclude: []
  ajv:
    exclude: []
