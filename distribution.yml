# Infrastructure distribution configuration
#
# This file defines which repositories receive infrastructure updates
# from @diplodoc/infra and per-repo exclusion rules.
#
# Synced automatically from metapackage .gitmodules via sync-packages-list.yml.
# Manual edits to blacklist/auto_merge settings are preserved during sync.
#
# Exclusion formats:
#   - .github/workflows/tests.yml          # exact path
#   - .github/workflows/*.yml              # glob pattern
#   - .github/workflows/                   # entire directory
#   - path: .github/workflows/tests.yml    # extended format
#     reason: "Custom workflow"             # why it's excluded
#     until: "2026-07-01"                  # auto-expires after this date

defaults:
  auto_merge: true
  exclude: []

# CI gate configuration (Ruleset A "master CI gate", see ADR-002).
# The sync-ci-gate workflow derives each repo's required status-check contexts
# from its workflow YAML files (jobs that run on `pull_request`).
# `exclude_checks` removes contexts that must NOT gate a PR (conditional /
# non-PR / one-off workflows). Per-repo patterns are merged onto this list.
# Glob patterns: `*` matches any run of characters.
# Per-repo override: repos.<name>.ci_gate.{ruleset_name,exclude_checks,required_checks}.
ci_gate:
  ruleset_name: 'master CI gate'
  exclude_checks:
    - 'SonarCloud*' # sonarcloud.yml — runs only when coverage was generated
    - 'release-please*' # release-please.yml — release PRs, not a PR gate
    - 'Update Dependencies*' # update-deps.yml — manual dispatch
    - 'Distribute*' # distribution workflow checks (infra repo only)
    - 'Publish*' # publish/release jobs — run on release/tag, skipped on PRs
    - 'Dependabot*' # dependabot security/version PR checks — not our CI gate
    - 'auto-approve*' # auto-approve.yml — infra meta-workflow, not a CI gate

# Protection gate (Ruleset B "master protection (auto-merge via app)", ADR-001).
# Review + merge policy, independent of any status check. sync ONLY creates it
# when a ruleset with this name is missing; it never modifies an existing one
# (so manual tweaks are preserved). Per-repo override / opt-out via
# repos.<name>.protection_gate.{enabled,ruleset_name,required_approving_review_count,
# require_code_owner_review,dismiss_stale_reviews_on_push,allowed_merge_methods}.
protection_gate:
  enabled: true
  ruleset_name: 'master protection (auto-merge via app)'
  required_approving_review_count: 1
  require_code_owner_review: true
  dismiss_stale_reviews_on_push: false
  allowed_merge_methods:
    - 'rebase'
    - 'squash'

repos:
  # === packages ===
  cli:
    exclude: []
  client:
    exclude: []
  components:
    exclude: []
    ci_gate:
      exclude_checks:
        - 'Create GitHub Comment'
        - 'deploy'
        - 'update-screenshots'
  directive:
    exclude: []
  liquid:
    exclude: []
  sentenizer:
    exclude: []
  transform:
    exclude: []
  translation:
    exclude: []
  utils:
    exclude: []
  yfmlint:
    exclude: []

  # === extensions ===
  algolia-extension:
    exclude: []
  color-extension:
    exclude: []
  cut-extension:
    exclude: []
  file-extension:
    exclude: []
  folding-headings-extension:
    exclude: []
  html-extension:
    exclude: []
  latex-extension:
    exclude: []
  mermaid-extension:
    exclude: []
  openapi-extension:
    exclude: []
  page-constructor-extension:
    exclude: []
  quote-link-extension:
    exclude: []
  search-extension:
    exclude: []
  tabs-extension:
    exclude: []

  # === devops ===
  babel-preset:
    auto_merge: false
    exclude: []
  package-template:
    exclude: []
  tsconfig:
    auto_merge: false
    exclude: []
  testpack:
    auto_merge: false
    exclude: []
  vsc:
    exclude: []
  ajv:
    exclude: []
