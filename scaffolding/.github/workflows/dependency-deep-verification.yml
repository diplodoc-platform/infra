# Dependency policy code and registry are loaded from an approved immutable infra revision.
# Update the trusted-infra SHA deliberately after reviewing new policy tooling.
name: Dependency Deep Verification
'on':
  pull_request:
    paths:
      - package.json
      - package-lock.json
permissions:
  contents: read
jobs:
  classify-dependency-diff:
    name: Classify Dependency Diff
    runs-on: ubuntu-latest
    outputs:
      has-dependency-changes: ${{ steps.decision.outputs.has-dependency-changes }}
      profile: ${{ steps.decision.outputs.profile }}
      risk: ${{ steps.decision.outputs.risk }}
      run-deep: ${{ steps.decision.outputs.run-deep }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
      - name: Checkout trusted dependency policy tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: diplodoc-platform/infra
          ref: 19a224ad8f1b6d2c3b50f5db8eba46fa6a4efd4f
          path: trusted-infra
          persist-credentials: false
      - name: Install locked dependencies safely
        run: npm ci --ignore-scripts
        working-directory: trusted-infra
      - name: Use only trusted policy tooling
        id: infra
        run: echo "path=trusted-infra" >> "$GITHUB_OUTPUT"
      - name: Extract base and head dependency manifests
        run: >
          git show "${{ github.event.pull_request.base.sha }}:package.json" > /tmp/before-pkg.json
          2>/dev/null || echo '{}' > /tmp/before-pkg.json

          git show "${{ github.event.pull_request.head.sha }}:package.json" > /tmp/after-pkg.json

          git show "${{ github.event.pull_request.base.sha }}:package-lock.json" >
          /tmp/before-lock.json 2>/dev/null || echo '{}' > /tmp/before-lock.json

          git show "${{ github.event.pull_request.head.sha }}:package-lock.json" >
          /tmp/after-lock.json 2>/dev/null || echo '{}' > /tmp/after-lock.json
      - name: Classify dependency changes
        env:
          INFRA_PATH: ${{ steps.infra.outputs.path }}
        run: |
          mkdir -p artifacts/dependency-deep-verification
          node "${INFRA_PATH}/scripts/dependency-policy-review.js" \
            --registry "${INFRA_PATH}/dependency-policy.yml" \
            --before-pkg /tmp/before-pkg.json \
            --after-pkg /tmp/after-pkg.json \
            --before-lock /tmp/before-lock.json \
            --after-lock /tmp/after-lock.json \
            --repo "${{ github.event.repository.name }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --comment artifacts/dependency-deep-verification/assessment.md \
            --json artifacts/dependency-deep-verification/assessment.json \
            --quiet
      - name: Export verification decision
        id: decision
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assessment = JSON.parse(
              fs.readFileSync('artifacts/dependency-deep-verification/assessment.json', 'utf8'),
          );
          const deepProfiles = new Set(['document-transform', 'document-rendering', 'ecosystem']);
          const summary = assessment.summary;
          if (typeof assessment.hasDependencyChanges !== 'boolean' ||
              !summary || !Number.isSafeInteger(summary.total) || summary.total < 0 ||
              !Array.isArray(assessment.direct) || !Array.isArray(assessment.transitive) ||
              summary.total !== assessment.direct.length + assessment.transitive.length ||
              assessment.hasDependencyChanges !== (summary.total > 0) ||
              !['low', 'medium', 'high', 'critical'].includes(assessment.maxRisk) ||
              !['standard-ci', ...deepProfiles].includes(assessment.verificationProfile) ||
              assessment.headSha !== process.env.EXPECTED_SHA) {
              throw new Error('Invalid or inconsistent dependency assessment');
          }
          const output = [
              `has-dependency-changes=${assessment.hasDependencyChanges}`,
              `profile=${assessment.verificationProfile}`,
              `risk=${assessment.maxRisk}`,
              `run-deep=${assessment.hasDependencyChanges && deepProfiles.has(assessment.verificationProfile)}`,
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, output.join('\n') + '\n');
          fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `Dependency changes: \`${assessment.summary.total}\`\n\nRisk: \`${assessment.maxRisk}\`\n\nProfile: \`${assessment.verificationProfile}\`\n\n`,
          );
          NODE
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Upload verification decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-deep-decision-${{ github.event.pull_request.number }}
          path: artifacts/dependency-deep-verification/
          if-no-files-found: error
          retention-days: 7
    timeout-minutes: 15
  deep-verification:
    name: Run Selected Deep Profile
    needs: classify-dependency-diff
    if: needs.classify-dependency-diff.outputs.run-deep == 'true'
    uses: diplodoc-platform/testpack/.github/workflows/downstream-check.yml@fd46ab34f47927f0bacbd25165aa8e9b4099d06b
    with:
      package: ${{ github.event.repository.name }}
      pr-sha: ${{ github.event.pull_request.head.sha }}
      pr-number: ${{ github.event.pull_request.number }}
      profile: ${{ needs.classify-dependency-diff.outputs.profile }}
