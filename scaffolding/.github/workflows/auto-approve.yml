# ⚠️ IMPORTANT: This workflow is a template from diplodoc/infra/scaffolding
# Do not edit this file in other packages - it is automatically copied from here.
# To modify this workflow, edit it in diplodoc/devops/infra/scaffolding/.github/workflows/
# and then run the scaffolding update process.

# Auto-approves automated bot PRs with the machine user `diplodoc-bot` so they
# satisfy required_approving_review_count / require_code_owner_review without a
# human. Only two kinds of bot PRs qualify (see scripts/match-auto-approve.js in
# @diplodoc/infra — keep the conditions below in sync with it):
#   - dependency updates from update-deps.yml (branch ci/update-deps/*)
#   - release PRs from release-please.yml      (branch release-please--*)
#
# The approver (diplodoc-bot via INFRA_APPROVER_PAT) differs from the PR author
# (yc-ui-bot), so GitHub's no-self-approval rule is not violated. This workflow
# only approves; it does NOT enable auto-merge (the CI gate still must pass).
#
# Defense in depth: the branch name alone is not trusted. Before approving we
# also verify EVERY commit on the PR was authored AND committed by yc-ui-bot, so
# a push by anyone else to a ci/update-deps/* or release-please--* branch does
# not earn a free code-owner approval. (Mirrors commitsAllAuthoredBy() in
# scripts/match-auto-approve.js.)
#
# To opt a repo out, exclude this file via .infrarc.yml or distribution.yml.

name: Auto-approve bot PRs

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    # Mirror of scripts/match-auto-approve.js: author must be the dep/release
    # bot and the head branch must match one of the two automated PR shapes.
    if: >
      github.event.pull_request.user.login == 'yc-ui-bot' &&
      (startsWith(github.event.pull_request.head.ref, 'ci/update-deps/') ||
       startsWith(github.event.pull_request.head.ref, 'release-please--'))
    steps:
      - name: Approve PR via diplodoc-bot machine user
        env:
          # Fine-grained PAT issued by the diplodoc-bot user (member of
          # @diplodoc-platform/team). Required scope: Pull requests: Read and write.
          GH_TOKEN: ${{ secrets.INFRA_APPROVER_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # The only identity whose automated commits we trust to auto-approve.
          ALLOWED_AUTHOR: 'yc-ui-bot'
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::warning::INFRA_APPROVER_PAT is not set — skipping auto-approve."
            exit 0
          fi

          # Content check: every commit on the PR must be authored AND committed
          # by the trusted bot. One commit per line as "<author>\t<committer>"
          # (one line per commit, so this is robust to pagination). A missing
          # GitHub-resolved login becomes an empty field and fails the match.
          mapfile -t COMMIT_LINES < <(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate \
            --jq '.[] | [(.author.login // ""), (.committer.login // "")] | @tsv' 2>/dev/null || true)
          if [[ ${#COMMIT_LINES[@]} -eq 0 ]]; then
            echo "::warning::Could not read commits for PR #${PR_NUMBER} — skipping auto-approve."
            exit 0
          fi
          for line in "${COMMIT_LINES[@]}"; do
            C_AUTHOR=$(cut -f1 <<<"${line}")
            C_COMMITTER=$(cut -f2 <<<"${line}")
            if [[ "${C_AUTHOR}" != "${ALLOWED_AUTHOR}" || "${C_COMMITTER}" != "${ALLOWED_AUTHOR}" ]]; then
              echo "::notice::PR #${PR_NUMBER} has a commit not authored by ${ALLOWED_AUTHOR} (author='${C_AUTHOR}', committer='${C_COMMITTER}') — skipping auto-approve."
              exit 0
            fi
          done

          # Resolve the approver login so we never self-approve and so we can
          # make the step idempotent (skip if already approved by this user).
          APPROVER=$(gh api user --jq '.login' 2>/dev/null || echo "")
          if [[ -n "${APPROVER}" && "${APPROVER}" == "${PR_AUTHOR}" ]]; then
            echo "::notice::Approver equals PR author (${APPROVER}) — skipping to avoid self-approval."
            exit 0
          fi

          if [[ -n "${APPROVER}" ]]; then
            ALREADY=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" \
              --json reviews \
              --jq "[.reviews[] | select(.author.login == \"${APPROVER}\" and .state == \"APPROVED\")] | length" \
              2>/dev/null || echo "0")
            if [[ "${ALREADY}" != "0" ]]; then
              echo "::notice::PR #${PR_NUMBER} already approved by ${APPROVER} — nothing to do."
              exit 0
            fi
          fi

          gh pr review "${PR_NUMBER}" --repo "${REPO}" --approve \
            --body "Auto-approved by diplodoc-bot (machine user, member of @diplodoc-platform/team) for an automated bot PR (dependency update / release). The change itself is generated by automation; this approval only satisfies branch-protection review requirements. CI must still pass."
