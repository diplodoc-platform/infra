name: Dependency Health Audit

# Central audit of all Diplodoc platform repositories for Dependabot
# PR SLA compliance. This is an infra-only workflow (NOT distributed via
# scaffolding) — it runs centrally in the infra repo using a GitHub App
# installation token that has read access to every target repository.
#
# SLA (see PLAN.md §5 and T8.1):
#   - Critical security  — 1 business day
#   - Other security     — 3 business days
#   - Patch               — 7 calendar days
#   - Minor               — 14 calendar days
#   - Major               — 30 calendar days
#   - Exception review    — at least every 90 days (registry review-after)
#
# Stabilization mode is manual and dry-run by default. It uploads reports but
# does not create tracking issues or assign owners. A schedule and mutating
# mode may be enabled only after the gates in docs/dependency-automation-
# stabilization.md are satisfied.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only; do not create issues or assign owners'
        type: boolean
        default: true
      skip_checks:
        description: 'Skip per-PR check-status lookup (faster)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  audit:
    name: Dependency Health Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: Ensure supported npm and install trusted infra dependencies
        shell: bash
        run: |
          REQUIRED_NPM=11.5.1
          if [ "$(printf '%s\n' "$REQUIRED_NPM" "$(npm -v)" | sort -V | head -n1)" != "$REQUIRED_NPM" ]; then
            npm install --prefix "$RUNNER_TEMP/npm-global" -g "npm@$REQUIRED_NPM"
            echo "$RUNNER_TEMP/npm-global/bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/npm-global/bin:$PATH"
          fi
          npm ci --ignore-scripts

      - name: Generate App token (org-wide audit access)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform

      - name: Run dependency health audit
        id: audit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SKIP_CHECKS: ${{ inputs.skip_checks }}
        run: |
          mkdir -p .status
          SKIP_FLAG=""
          if [ "${SKIP_CHECKS}" = "true" ]; then
            SKIP_FLAG="--skip-checks"
          fi
          # Non-zero exit when SLA breached / exceptions overdue is expected —
          # capture it so the report is still uploaded below.
          set +e
          node scripts/dependency-health.js \
            --all \
            --output .status/dependency-health.json \
            --markdown .status/dependency-health.md \
            $SKIP_FLAG
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"

      - name: Generate daily dependency summary
        id: summary
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SKIP_CHECKS: ${{ inputs.skip_checks }}
        run: |
          SKIP_FLAG=""
          if [ "${SKIP_CHECKS}" = "true" ]; then
            SKIP_FLAG="--skip-checks"
          fi
          # The summary script exits non-zero when actionable items are found.
          # Capture the exit code so the issue is still posted below.
          set +e
          node scripts/dependency-summary.js \
            --all \
            --output .status/dependency-summary.json \
            --markdown .status/dependency-summary.md \
            $SKIP_FLAG
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload summary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-summary-report
          path: .status/dependency-summary.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Post daily summary as tracking issue
        if: always() && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ ! -f .status/dependency-summary.md ]; then
            echo "No summary file found, skipping issue post."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          TITLE="Daily Dependency Health Summary — ${DATE}"
          # Check if an issue with this title already exists (avoid duplicates).
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --search "${TITLE} in:title" --state open --json number --limit 1 2>/dev/null || echo "")
          BODY=$(cat .status/dependency-summary.md)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "[]" ]; then
            NUMBER=$(echo "$EXISTING" | jq -r '.[0].number')
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "Updated existing issue #$NUMBER"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body "$BODY" \
              --label "dependency-health,summary"
            echo "Created new daily summary issue"
          fi

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-health-report
          path: .status/dependency-health.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Plan or apply owner assignments
        id: assign
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_CHECKS: ${{ inputs.skip_checks }}
        run: |
          SKIP_FLAG=""
          DRY_RUN_FLAG=""
          if [ "${SKIP_CHECKS}" = "true" ]; then
            SKIP_FLAG="--skip-checks"
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          # The assign script exits non-zero when SLA breaches are found
          # (so the audit surfaces as failing). Capture the exit code so
          # the report is still uploaded above and the job summary is written.
          set +e
          node scripts/dependency-assign.js \
            --all \
            --output .status/dependency-assign.json \
            --markdown .status/dependency-assign.md \
            $SKIP_FLAG \
            $DRY_RUN_FLAG
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload assign report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-assign-report
          path: .status/dependency-assign.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Write job summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./scripts/workflows/dependency-health-summary.js');
            await run({github, context, core});

      - name: Fail on SLA breach / overdue exception / actionable items
        if: steps.audit.outputs.exit-code != '0' || steps.summary.outputs.exit-code != '0' || steps.assign.outputs.exit-code != '0'
        run: |
          echo "::error::Dependency health audit found SLA breaches, overdue exceptions, actionable summary items, or assignment actions. See uploaded reports and the job summary."
          exit 1
