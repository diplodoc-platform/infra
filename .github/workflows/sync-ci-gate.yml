name: Sync CI Gate

# Points each target repo's "master CI gate" ruleset (Ruleset A, see ADR-002)
# at the set of CI status-check contexts derived from its workflow files.
# Stabilization mode is manual and dry-run by default. Applying rulesets and
# restoring a schedule require the gates in
# docs/dependency-automation-stabilization.md.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target repo name (or "all" for all repos)'
        default: 'all'
        type: string
      dry_run:
        description: 'Discover and report contexts without changing rulesets'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  # ============================================================================
  # prepare: resolve the list of repos to process from distribution.yml.
  # ============================================================================
  prepare:
    name: Prepare repository list
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.repos.outputs.list }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js and npm
        uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: ''
          run-install: 'false'

      - name: Install trusted infra dependencies without lifecycle scripts
        shell: bash
        run: npm ci --ignore-scripts

      - name: Build repo list
        id: repos
        # inputs.target is user-controlled; funnel through env and JSON-encode
        # in node so quotes/backslashes cannot corrupt the array literal.
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          export TARGET="${INPUT_TARGET:-all}"

          if [[ "$TARGET" != "all" ]]; then
            SAFE_LIST=$(node -e 'process.stdout.write(JSON.stringify([process.env.TARGET]))')
            echo "list=${SAFE_LIST}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REPOS=$(node -e "
            const yaml = require('js-yaml');
            const fs = require('fs');
            const config = yaml.load(fs.readFileSync('distribution.yml', 'utf8'));
            const repos = Object.keys(config.repos || {});
            console.log(JSON.stringify(repos));
          ")

          echo "list=${REPOS}" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # sync: a matrix over all targets. For each repo, mint an App token scoped to
  # that repo (App must have Administration: write), discover its CI contexts and
  # create/update the "master CI gate" ruleset. Each cell writes a thin
  # status-<repo>.json artifact consumed by `report`.
  # ============================================================================
  sync:
    name: 'Sync ${{ matrix.repo }}'
    needs: prepare
    if: needs.prepare.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJson(needs.prepare.outputs.repos) }}
      fail-fast: false
      max-parallel: 5
    env:
      REPO_NAME: ${{ matrix.repo }}
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v5

      - name: Generate App token for target repo
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform
          repositories: ${{ matrix.repo }}

      - name: Setup Node.js and npm
        uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: ''
          run-install: 'false'

      - name: Install trusted infra dependencies without lifecycle scripts
        shell: bash
        run: npm ci --ignore-scripts

      - name: Plan or sync CI gate ruleset
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # App id is used as the Integration bypass actor on the protection gate
          # (Ruleset B) when the script has to create it on a repo that lacks one.
          INFRA_APP_ID: ${{ secrets.INFRA_APP_ID }}
        run: |
          mkdir -p .status
          DRY_RUN_FLAG=""
          if [ "${DRY_RUN}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          node scripts/sync-ci-gate.js \
            --repo "${REPO_NAME}" \
            --config ./distribution.yml \
            --output ".status/status-${REPO_NAME}.json" \
            $DRY_RUN_FLAG

      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: status-${{ matrix.repo }}
          path: .status/status-${{ matrix.repo }}.json
          retention-days: 1
          if-no-files-found: warn

  # ============================================================================
  # report: aggregate per-repo status artifacts into a markdown summary table.
  # Fails the run if any repo ended in `failed`.
  # ============================================================================
  report:
    name: Build sync report
    needs: [prepare, sync]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted report helpers
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download all status artifacts
        uses: actions/download-artifact@v7
        with:
          path: .status
          pattern: status-*
          merge-multiple: true

      - name: Render summary table
        uses: actions/github-script@v7
        env:
          REPOS_JSON: ${{ needs.prepare.outputs.repos }}
        with:
          script: |
            const run = require('./scripts/workflows/ci-gate-report.js');
            await run({github, context, core});
