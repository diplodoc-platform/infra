name: Sync CI Gate

# Points each target repo's "master CI gate" ruleset (Ruleset A, see ADR-002)
# at the set of CI status-check contexts derived from its workflow files.
# Runs weekly (new workflows appear rarely) and on manual dispatch.

on:
  schedule:
    # Weekly on Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target repo name (or "all" for all repos)'
        default: 'all'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  # ============================================================================
  # prepare: resolve the list of repos to process from distribution.yml.
  # ============================================================================
  prepare:
    name: Prepare repository list
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.repos.outputs.list }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: ''

      - name: Build repo list
        id: repos
        # inputs.target is user-controlled; funnel through env and JSON-encode
        # in node so quotes/backslashes cannot corrupt the array literal.
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          export TARGET="${INPUT_TARGET:-all}"

          if [[ "$TARGET" != "all" ]]; then
            SAFE_LIST=$(node -e 'process.stdout.write(JSON.stringify([process.env.TARGET]))')
            echo "list=${SAFE_LIST}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REPOS=$(node -e "
            const yaml = require('js-yaml');
            const fs = require('fs');
            const config = yaml.load(fs.readFileSync('distribution.yml', 'utf8'));
            const repos = Object.keys(config.repos || {});
            console.log(JSON.stringify(repos));
          ")

          echo "list=${REPOS}" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # sync: a matrix over all targets. For each repo, mint an App token scoped to
  # that repo (App must have Administration: write), discover its CI contexts and
  # create/update the "master CI gate" ruleset. Each cell writes a thin
  # status-<repo>.json artifact consumed by `report`.
  # ============================================================================
  sync:
    name: 'Sync ${{ matrix.repo }}'
    needs: prepare
    if: needs.prepare.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJson(needs.prepare.outputs.repos) }}
      fail-fast: false
      max-parallel: 5
    env:
      REPO_NAME: ${{ matrix.repo }}
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v5

      - name: Generate App token for target repo
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform
          repositories: ${{ matrix.repo }}

      - name: Setup Node.js and install dependencies
        uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: ''

      - name: Sync CI gate ruleset
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # App id is used as the Integration bypass actor on the protection gate
          # (Ruleset B) when the script has to create it on a repo that lacks one.
          INFRA_APP_ID: ${{ secrets.INFRA_APP_ID }}
        run: |
          mkdir -p .status
          node scripts/sync-ci-gate.js \
            --repo "${REPO_NAME}" \
            --config ./distribution.yml \
            --output ".status/status-${REPO_NAME}.json"

      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: status-${{ matrix.repo }}
          path: .status/status-${{ matrix.repo }}.json
          retention-days: 1
          if-no-files-found: warn

  # ============================================================================
  # report: aggregate per-repo status artifacts into a markdown summary table.
  # Fails the run if any repo ended in `failed`.
  # ============================================================================
  report:
    name: Build sync report
    needs: [prepare, sync]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all status artifacts
        uses: actions/download-artifact@v7
        with:
          path: .status
          pattern: status-*
          merge-multiple: true

      - name: Render summary table
        uses: actions/github-script@v7
        env:
          REPOS_JSON: ${{ needs.prepare.outputs.repos }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const ORG = 'diplodoc-platform';
            const serverUrl = context.serverUrl || 'https://github.com';
            const runId = context.runId;
            const runUrl = `${serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            /** @type {Map<string, string>} repo short name -> matrix job page URL */
            const jobUrlByRepo = new Map();
            try {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              });
              for (const job of jobs) {
                const match = /^Sync (.+)$/.exec(job.name || '');
                if (match && job.html_url) jobUrlByRepo.set(match[1], job.html_url);
              }
            } catch (err) {
              core.warning(`Could not list workflow jobs for run ${runId}: ${err.message}`);
            }

            const allRepos = JSON.parse(process.env.REPOS_JSON || '[]');
            const statusDir = '.status';
            const statuses = new Map();
            if (fs.existsSync(statusDir)) {
              for (const name of fs.readdirSync(statusDir)) {
                if (!name.startsWith('status-') || !name.endsWith('.json')) continue;
                try {
                  const data = JSON.parse(fs.readFileSync(path.join(statusDir, name), 'utf8'));
                  if (data && data.repo) statuses.set(data.repo, data);
                } catch (err) {
                  core.warning(`Failed to parse ${name}: ${err.message}`);
                }
              }
            }

            const rows = allRepos.map((repo) => {
              const s = statuses.get(repo);
              if (!s) return {repo, status: 'failed', reason: 'no status artifact produced'};
              return s;
            });

            const icons = {
              created: '✅ Created',
              updated: '✅ Updated',
              unchanged: '✓ Unchanged',
              'dry-run': '🔎 Dry-run',
              skipped: '⊘ Skipped',
              failed: '❌ Failed',
            };

            const counts = {};
            for (const r of rows) counts[r.status] = (counts[r.status] || 0) + 1;

            for (const r of rows) {
              const head = `[${r.repo}]`;
              const prot =
                r.protection_action && r.protection_action !== 'none'
                  ? ` · protection: ${r.protection_action}`
                  : '';
              if (r.status === 'created' || r.status === 'updated') {
                core.notice(`${head} ✅ ${r.status} — ${(r.contexts || []).length} context(s)${prot}`);
              } else if (r.status === 'unchanged') {
                core.notice(`${head} ✓ Unchanged — ${(r.contexts || []).length} context(s) already match${prot}`);
              } else if (r.status === 'skipped') {
                core.notice(`${head} ⊘ Skipped — ${r.reason || 'no changes'}${prot}`);
              } else if (r.status === 'failed') {
                core.error(`${head} ❌ Failed — ${r.reason || 'unknown error'}`);
              }
              if (Array.isArray(r.collision_warnings) && r.collision_warnings.length) {
                for (const w of r.collision_warnings) {
                  core.warning(
                    `${head} collision: "${w.context}" claimed by ${w.workflows.join(', ')} — give jobs distinct names`,
                  );
                }
              }
            }

            const order = {failed: 0, skipped: 1, unchanged: 2, updated: 3, created: 4, 'dry-run': 5};
            rows.sort((a, b) => {
              const oa = order[a.status] ?? 99;
              const ob = order[b.status] ?? 99;
              if (oa !== ob) return oa - ob;
              return a.repo.localeCompare(b.repo);
            });

            const formatRow = (r) => {
              const status = icons[r.status] || r.status;
              const repoCell = `[${r.repo}](${serverUrl}/${ORG}/${r.repo})`;
              const jobUrl = jobUrlByRepo.get(r.repo) || runUrl;
              const actionCell = `[Sync job](${jobUrl})`;
              const action =
                r.action && r.action !== 'none'
                  ? r.action
                  : r.status === 'unchanged'
                    ? 'unchanged'
                    : '—';
              const prot =
                r.protection_action && r.protection_action !== 'none'
                  ? r.protection_action
                  : '—';
              const ctx = (r.contexts || []).length;
              const list = (r.contexts || []).length
                ? '<br>' + r.contexts.map((c) => `\`${c}\``).join('<br>')
                : '';
              const noteParts = [];
              if (r.reason) noteParts.push(r.reason);
              if (Array.isArray(r.collision_warnings) && r.collision_warnings.length) {
                for (const w of r.collision_warnings) {
                  noteParts.push(
                    `⚠ collision: \`${w.context}\` in ${w.workflows.map((f) => `\`${f}\``).join(', ')}`,
                  );
                }
              }
              const note = noteParts.join('<br>');
              return `| ${repoCell} | ${actionCell} | ${status} | ${action} | ${prot} | ${ctx}${list} | ${note} |`;
            };

            const lines = [
              '## CI gate sync summary',
              '',
              `Total: **${rows.length}** · ✅ Created: **${counts.created || 0}** · ✅ Updated: **${counts.updated || 0}** · ✓ Unchanged: **${counts.unchanged || 0}** · ⊘ Skipped: **${counts.skipped || 0}** · ❌ Failed: **${counts.failed || 0}**`,
              '',
              '| Repo | Job | Status | CI gate | Protection | Required contexts | Note |',
              '| --- | --- | --- | --- | --- | --- | --- |',
              ...rows.map(formatRow),
            ];

            await core.summary.addRaw(lines.join('\n')).write();

            if ((counts.failed || 0) > 0) {
              core.setFailed(`${counts.failed} repo(s) failed to sync. See the summary table above.`);
            }
