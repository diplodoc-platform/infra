name: Verify frozen host-peer train
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: '24'
          cache: ''
          run-install: 'false'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v7
        with:
          name: dependency-train-plan
          run-id: 42471034476
          github-token: ${{ github.token }}
          path: selected
      - name: Bind immutable proposed CLI baseline and released sources
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSED_REVISIONS: >-
            {"cli":"23a9c8e4541f58a8e508b255614a1c40930c410c","transform":"9e834f1c74e8222d003e683c9c2422cc4f8263e8","translation":"ae0ad7ee9893a684a86d8a2ae6b75c0f084a21a5"}
        run: node scripts/verify-host-peer-train.js
      - name: Build exact schema-2 train without publishing
        run: node scripts/candidate-train/build.js proposed-plan.json "$RUNNER_TEMP/train-payload"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-peer-train-evidence
          path: |
            proposed-plan.json
            ${{ runner.temp }}/train-payload
          if-no-files-found: error
