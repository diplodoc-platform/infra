name: Validate proposed runtime baseline

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: '24'
          cache: ''
          run-install: 'false'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v7
        with:
          name: dependency-train-plan
          run-id: 42471034476
          github-token: ${{ github.token }}
          path: selected
      - name: Bind proposed baseline PRs to exact source commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/runtime-pins-diagnostic.js
      - name: Run unchanged strict train builder without publishing
        run: node scripts/candidate-train/build.js proposed-plan.json "$RUNNER_TEMP/train-payload"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proposed-baseline-evidence
          path: |
            proposed-plan.json
            ${{ runner.temp }}/train-payload
          if-no-files-found: error
