name: Morning Dependency Candidate Train
run-name: "Morning Dependency Candidate Train · ${{ (github.event_name == 'schedule' || inputs.dry_run == false) && 'prepare' || 'dry-run' }}"

on:
  schedule:
    - cron: '0 22 * * *' # 01:00 Europe/Moscow. Preparation is opt-in.
  workflow_dispatch:
    inputs:
      selection_mode:
        description: 'Coordinated groups, or the legacy independent wave selector'
        type: choice
        options: [cohort, wave]
        default: cohort
      cohort_prs:
        description: 'Manual indivisible group: repo#PR,repo#PR; one PR per supported repository'
        type: string
        default: ''
      cohort_dependency:
        description: 'Optional shared dependency; requires every supported direct consumer at one locked version'
        type: string
        default: ''
      risk_level:
        description: 'Automatic risk priority up to the organization ceiling, or one exact group risk'
        type: choice
        options: [auto, low, medium, high, critical]
        default: auto
      dry_run:
        description: 'Selection only; false explicitly approves one preparation run'
        type: boolean
        default: true
      repositories:
        description: 'Repository allowlist or all supported packages; falls back to organization variable'
        type: string
        default: ''
      pr_number:
        description: 'Optional exact Dependabot PR; requires one repository'
        type: number
        default: 0
      wave:
        description: 'Starting group or legacy wave index; inspect the dry-run inventory first'
        type: number
        default: 1

permissions:
  actions: read
  contents: read

concurrency:
  group: dependency-candidate-train
  cancel-in-progress: false

jobs:
  select:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.DEPENDENCY_CANDIDATE_TRAIN_ENABLED == 'true' && vars.DEPENDENCY_TRAIN_AUTOMATIC_GROUPS_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
      attempts: ${{ steps.plan.outputs.attempts }}
      plan-artifact: ${{ steps.plan-artifact.outputs.artifact-id }}
      preparation-available: ${{ steps.open-candidate.outputs.available }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: ''
          run-install: 'false'
      - run: npm ci --ignore-scripts
      - name: Select immutable Dependabot candidates (data only)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_TRAIN_REPOSITORIES: ${{ inputs.repositories || vars.DEPENDENCY_TRAIN_REPOSITORIES }}
          DEPENDENCY_TRAIN_RISK_LEVEL: ${{ inputs.risk_level || 'auto' }}
          DEPENDENCY_TRAIN_MAX_RISK: ${{ vars.DEPENDENCY_TRAIN_MAX_RISK || 'low' }}
          DEPENDENCY_TRAIN_SELECTION_MODE: ${{ github.event_name == 'schedule' && 'cohort' || inputs.selection_mode || 'cohort' }}
          DEPENDENCY_TRAIN_PR_NUMBER: ${{ inputs.pr_number || '0' }}
          DEPENDENCY_TRAIN_WAVE: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.wave) || '1' }}
          DEPENDENCY_TRAIN_COHORT_PRS: ${{ github.event_name == 'workflow_dispatch' && inputs.cohort_prs || '' }}
          DEPENDENCY_TRAIN_COHORT_DEPENDENCY: ${{ github.event_name == 'workflow_dispatch' && inputs.cohort_dependency || '' }}
        run: node scripts/candidate-train/plan.js
      - uses: actions/upload-artifact@v4
        id: plan-artifact
        with:
          name: dependency-train-plan
          path: |
            train-plan.json
            train-plan-*.json
          if-no-files-found: error
      # The private ops webhook reads these step outcomes from this exact attempt.
      - name: No eligible dependency group
        if: steps.plan.outputs.selected == '0'
        run: echo 'No eligible dependency group'
      - name: Check for an open candidate before preparation
        if: steps.plan.outputs.selected != '0'
        id: open-candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/candidate-train/open-candidate.js
      - name: Preparation blocked by an open CLI candidate
        if: steps.plan.outputs.selected != '0' && steps.open-candidate.outputs.available == 'false'
        run: echo 'Preparation blocked by an open CLI candidate. See the run summary.'

  build:
    needs: select
    if: >-
      needs.select.outputs.selected != '0' &&
      needs.select.outputs['preparation-available'] == 'true' &&
      ((github.event_name == 'workflow_dispatch' && toJSON(inputs.dry_run) == 'false') ||
      (github.event_name == 'schedule' && vars.DEPENDENCY_CANDIDATE_TRAIN_ENABLED == 'true'))
    uses: ./.github/workflows/dependency-candidate-build.yml
    with:
      plan-artifact: ${{ needs.select.outputs.plan-artifact }}
      group-offset: '0'
      allow-fallback: ${{ needs.select.outputs.attempts > 1 }}

  build-second:
    needs: [select, build]
    if: needs.build.outputs.passed == 'false' && needs.select.outputs.attempts > 1
    uses: ./.github/workflows/dependency-candidate-build.yml
    with:
      plan-artifact: ${{ needs.select.outputs.plan-artifact }}
      group-offset: '1'
      allow-fallback: ${{ needs.select.outputs.attempts > 2 }}

  build-third:
    needs: [select, build-second]
    if: needs.build-second.outputs.passed == 'false' && needs.select.outputs.attempts > 2
    uses: ./.github/workflows/dependency-candidate-build.yml
    with:
      plan-artifact: ${{ needs.select.outputs.plan-artifact }}
      group-offset: '2'
      allow-fallback: false

  publish:
    needs: [select, build, build-second, build-third]
    if: >-
      !cancelled() &&
      ((needs.build.result == 'success' && needs.build.outputs['payload-artifact'] != '') ||
       (needs.build-second.result == 'success' && needs.build-second.outputs['payload-artifact'] != '') ||
       (needs.build-third.result == 'success' && needs.build-third.outputs['payload-artifact'] != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: ''
          run-install: 'false'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.select.outputs.plan-artifact }}
          path: selected
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.build.outputs['payload-artifact'] || needs.build-second.outputs['payload-artifact'] || needs.build-third.outputs['payload-artifact'] }}
          path: train-payload
          merge-multiple: true
      - name: Generate token scoped only to CLI
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform
          repositories: cli
      - name: Validate data and open one immutable temporary CLI PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          DEPENDENCY_TRAIN_REPOSITORIES: ${{ inputs.repositories || vars.DEPENDENCY_TRAIN_REPOSITORIES }}
          DEPENDENCY_TRAIN_RISK_LEVEL: ${{ inputs.risk_level || 'auto' }}
          DEPENDENCY_TRAIN_MAX_RISK: ${{ vars.DEPENDENCY_TRAIN_MAX_RISK || 'low' }}
          DEPENDENCY_TRAIN_SELECTION_MODE: ${{ github.event_name == 'schedule' && 'cohort' || inputs.selection_mode || 'cohort' }}
          DEPENDENCY_TRAIN_WAVE: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.wave) || '1' }}
          DEPENDENCY_CANDIDATE_PREPARE_APPROVED: 'true'
          TRAIN_GROUP_OFFSET: ${{ needs.build-third.outputs['payload-artifact'] && '2' || needs.build-second.outputs['payload-artifact'] && '1' || '0' }}
          DEPENDENCY_TRAIN_COHORT_PRS: ${{ github.event_name == 'workflow_dispatch' && inputs.cohort_prs || '' }}
          DEPENDENCY_TRAIN_COHORT_DEPENDENCY: ${{ github.event_name == 'workflow_dispatch' && inputs.cohort_dependency || '' }}
          TRAIN_APP_TOKEN: ${{ steps.app.outputs.token }}
          TRAIN_BOT_TOKEN: ${{ secrets.INFRA_APPROVER_PAT }}
          TRAIN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/candidate-train/publish.js selected/train-plan.json train-payload
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-train-candidate
          path: train-candidate.json
          if-no-files-found: error
