name: Distribute Infrastructure

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target repo name (or "all" for all repos)'
        default: 'all'
        type: string
      version:
        description: 'Version tag (auto-detected from release)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare repository list
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.repos.outputs.list }}
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build repo list
        id: repos
        run: |
          TARGET="${{ inputs.target || 'all' }}"

          if [[ "$TARGET" != "all" ]]; then
            echo "list=[\"${TARGET}\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract repo names from distribution.yml
          REPOS=$(node -e "
            const fs = require('fs');
            const content = fs.readFileSync('distribution.yml', 'utf8');
            const repoLines = content.match(/^  \\w[\\w-]*:/gm) || [];
            const repos = repoLines.map(l => l.trim().replace(':', ''));
            console.log(JSON.stringify(repos));
          ")

          echo "list=${REPOS}" >> "$GITHUB_OUTPUT"

  distribute:
    name: 'Update ${{ matrix.repo }}'
    needs: prepare
    if: needs.prepare.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJson(needs.prepare.outputs.repos) }}
      fail-fast: false
      max-parallel: 5
    env:
      GH_TOKEN: ${{ secrets.YC_UI_BOT_GITHUB_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Install latest npm (>= 11.5.1)
        run: |
          [ "$(printf '%s\n' "11.5.1" "$(npm -v)" | sort -V | head -n1)" = "11.5.1" ] || npm install -g npm@11.5.1
        shell: bash

      - name: Clone target repository
        run: |
          gh repo clone diplodoc-platform/${{ matrix.repo }} target -- --depth 1

      - name: Apply scaffolding
        run: |
          node bin/infra.js sync \
            --target ./target \
            --repo ${{ matrix.repo }} \
            --config ./distribution.yml

      - name: Update @diplodoc/infra version in package.json
        working-directory: target
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = '${VERSION}'.replace(/^v/, '');
            let updated = false;

            for (const depType of ['devDependencies', 'dependencies']) {
              if (pkg[depType]) {
                if (pkg[depType]['@diplodoc/infra']) {
                  pkg[depType]['@diplodoc/infra'] = version;
                  updated = true;
                }
                // Migration: replace @diplodoc/lint with @diplodoc/infra
                if (pkg[depType]['@diplodoc/lint']) {
                  delete pkg[depType]['@diplodoc/lint'];
                  pkg[depType]['@diplodoc/infra'] = version;
                  updated = true;
                }
              }
            }

            if (updated) {
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              console.log('Updated @diplodoc/infra to ' + version);
            } else {
              console.log('@diplodoc/infra not found in dependencies, skipping');
            }
          "

      - name: Check for changes
        id: changes
        working-directory: target
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes in ${{ matrix.repo }}:"
            git diff --stat
          fi

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: target
        run: |
          BRANCH="infra/update-${VERSION}"

          # Check if branch already exists (update existing PR)
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${BRANCH}"
            git checkout "${BRANCH}"
            git reset --hard HEAD
          else
            git checkout -b "${BRANCH}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore: update infrastructure to ${VERSION}"
          git push --force-with-lease origin "${BRANCH}"

          # Create PR if it doesn't exist
          EXISTING_PR=$(gh pr list --head "${BRANCH}" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [[ -z "$EXISTING_PR" ]]; then
            gh pr create \
              --title "chore: update infrastructure to ${VERSION}" \
              --body "$(cat <<'BODY'
          ## Automated Infrastructure Update

          This PR was automatically created by the infrastructure distribution workflow.

          **Version:** ${VERSION}
          **Source:** @diplodoc/infra

          ### What changed
          Infrastructure scaffolding files have been updated to the latest version.
          This includes linting configs, CI workflows, and other shared configuration.

          ---
          _If this PR breaks CI, please review the changes and adjust as needed._
          _To exclude specific files from future updates, add them to `.infrarc.yml`._
          BODY
          )" \
              --label "infra-auto"
          fi

      - name: Enable auto-merge
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: target
        run: |
          AUTO_MERGE=$(node -e "
            const fs = require('fs');
            const content = fs.readFileSync('../distribution.yml', 'utf8');

            // Parse defaults
            const defaultMatch = content.match(/defaults:[\\s\\S]*?auto_merge:\\s*(true|false)/);
            let autoMerge = defaultMatch ? defaultMatch[1] === 'true' : false;

            // Parse repo-specific override
            const repoMatch = content.match(new RegExp('  ${{ matrix.repo }}:[\\\\s\\\\S]*?(?=\\n  \\\\w|$)'));
            if (repoMatch && /auto_merge:\\s*(true|false)/.test(repoMatch[0])) {
              autoMerge = repoMatch[0].match(/auto_merge:\\s*(true|false)/)[1] === 'true';
            }

            console.log(autoMerge ? 'true' : 'false');
          ")

          if [[ "$AUTO_MERGE" == "true" ]]; then
            gh pr merge --auto --squash 2>/dev/null || echo "Note: auto-merge not available for ${{ matrix.repo }}"
          else
            echo "Auto-merge disabled for ${{ matrix.repo }} (manual review required)"
          fi
