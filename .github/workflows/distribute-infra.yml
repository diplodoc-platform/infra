name: Distribute Infrastructure

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target repo name (or "all" for all repos)'
        default: 'all'
        type: string
      version:
        description: 'Version tag (auto-detected from release)'
        required: false
        type: string

permissions:
  contents: read
  # actions: read is required for the aggregate-changed job to list workflow
  # run artifacts via the GitHub API (used to derive the list of repos with
  # pending changes from `pending-changes-<repo>` artifact names).
  actions: read

jobs:
  prepare:
    name: Prepare repository list
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.repos.outputs.list }}
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Install latest npm (>= 11.5.1)
        run: |
          [ "$(printf '%s\n' "11.5.1" "$(npm -v)" | sort -V | head -n1)" = "11.5.1" ] || npm install -g npm@11.5.1
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build repo list
        id: repos
        run: |
          TARGET="${{ inputs.target || 'all' }}"

          if [[ "$TARGET" != "all" ]]; then
            echo "list=[\"${TARGET}\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract repo names from distribution.yml (only from repos: section)
          REPOS=$(node -e "
            const yaml = require('js-yaml');
            const fs = require('fs');
            const config = yaml.load(fs.readFileSync('distribution.yml', 'utf8'));
            const repos = Object.keys(config.repos || {});
            console.log(JSON.stringify(repos));
          ")

          echo "list=${REPOS}" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # check-changes: clone target repo, apply scaffolding, detect if anything
  # actually changed. If there are no changes — this job ends with exit 0 and
  # does NOT upload the `pending-changes-<repo>` artifact. The aggregate-changed
  # job below then derives the list of repos with real diffs from the set of
  # uploaded artifacts; that list becomes the matrix for `distribute`, so repos
  # without changes simply never get a matrix cell.
  # ============================================================================
  check-changes:
    name: 'Check ${{ matrix.repo }}'
    needs: prepare
    if: needs.prepare.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJson(needs.prepare.outputs.repos) }}
      fail-fast: false
      max-parallel: 5
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Generate App token for target repo
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform
          repositories: ${{ matrix.repo }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Install latest npm (>= 11.5.1)
        run: |
          [ "$(printf '%s\n' "11.5.1" "$(npm -v)" | sort -V | head -n1)" = "11.5.1" ] || npm install -g npm@11.5.1
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Clone target repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh repo clone diplodoc-platform/${{ matrix.repo }} target -- --depth 1
          cd target
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/diplodoc-platform/${{ matrix.repo }}.git"

      - name: Apply scaffolding
        run: |
          node bin/infra.js sync \
            --target ./target \
            --repo ${{ matrix.repo }} \
            --config ./distribution.yml

      - name: Update @diplodoc/infra version in package.json
        working-directory: target
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = '${VERSION}'.replace(/^v/, '');
            let updated = false;

            for (const depType of ['devDependencies', 'dependencies']) {
              if (pkg[depType]) {
                if (pkg[depType]['@diplodoc/infra']) {
                  pkg[depType]['@diplodoc/infra'] = version;
                  updated = true;
                }
                // Migration: replace @diplodoc/lint with @diplodoc/infra
                if (pkg[depType]['@diplodoc/lint']) {
                  delete pkg[depType]['@diplodoc/lint'];
                  pkg[depType]['@diplodoc/infra'] = version;
                  updated = true;
                }
              }
            }

            if (updated) {
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              console.log('Updated @diplodoc/infra to ' + version);
            } else {
              console.log('@diplodoc/infra not found in dependencies, skipping');
            }
          "

      # ============================================================================
      # === BEGIN MIGRATION: @diplodoc/lint → @diplodoc/infra (REMOVE AFTER DONE) ===
      # ============================================================================
      # Temporary one-shot rewrite of legacy package references in consumer source
      # files (e.g. `esbuild/build.mjs` imports `@diplodoc/lint/esbuild`). Scaffolding
      # files are already shipped with the new name; this step only touches files
      # that are NOT managed by scaffolding (custom build scripts, helpers, etc.).
      #
      # Remove this step once `MIGRATION.md` § Cleanup is complete and no consumer
      # repository contains the legacy reference. See MIGRATION.md for the checklist.
      # ============================================================================
      - name: 'MIGRATION: Replace legacy @diplodoc/lint references in source files'
        working-directory: target
        run: |
          set -euo pipefail

          FILES=$(grep -rl '@diplodoc/lint' . \
            --include='*.mjs' \
            --include='*.cjs' \
            --include='*.js' \
            --include='*.ts' \
            --include='*.tsx' \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=dist \
            --exclude-dir=lib \
            --exclude-dir=coverage \
            || true)

          if [[ -z "$FILES" ]]; then
            echo "No legacy @diplodoc/lint references found — migration step is a no-op."
            exit 0
          fi

          echo "Rewriting @diplodoc/lint → @diplodoc/infra in:"
          echo "$FILES"
          echo "$FILES" | xargs sed -i 's|@diplodoc/lint|@diplodoc/infra|g'
      # ============================================================================
      # === END MIGRATION ==========================================================
      # ============================================================================

      - name: Check for changes
        id: changes
        working-directory: target
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No changes::No scaffolding changes for ${{ matrix.repo }} — distribute job will be skipped."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes in ${{ matrix.repo }}:"
            git diff --stat
          fi

      # Pack the prepared target tree (with applied scaffolding + uncommitted
      # changes) so the `distribute` job can pick it up and push without redoing
      # the heavy clone/sync work. We use `tar` to preserve permissions and the
      # full `.git` directory (needed for `git commit` & `git push` later).
      - name: Pack target directory
        if: steps.changes.outputs.has_changes == 'true'
        run: tar -czf target.tar.gz -C target .

      # Upload the prepared target as an artifact so the `distribute` job can
      # pick it up without redoing the clone/sync work.
      - name: Upload prepared target as artifact
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pending-changes-${{ matrix.repo }}
          path: target.tar.gz
          retention-days: 1
          if-no-files-found: error

  # ============================================================================
  # aggregate-changed: collect the list of repos that have pending changes
  # (i.e. whose check-changes cell uploaded a `pending-changes-<repo>` artifact)
  # and emit it as a JSON array. The `distribute` job uses this array as its
  # matrix source — so repos without changes simply don't get a matrix cell,
  # giving a clean per-repo skip behavior.
  #
  # If the resulting list is empty, the `distribute` job itself is shown as
  # ⊘ Skipped (grey icon) in the GitHub UI thanks to its `if:` guard.
  # ============================================================================
  aggregate-changed:
    name: Aggregate changed repos
    needs: [prepare, check-changes]
    # `always()` so we still aggregate when some matrix cells failed.
    # Empty-repo guard short-circuits the rest.
    if: always() && needs.prepare.outputs.repos != '[]'
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.aggregate.outputs.repos }}
      count: ${{ steps.aggregate.outputs.count }}
    steps:
      - name: Build list of repos with pending changes
        id: aggregate
        uses: actions/github-script@v7
        with:
          script: |
            // List all artifacts for the current workflow run. The presence of
            // a `pending-changes-<repo>` artifact is the signal that this repo
            // has actual diff to distribute.
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });

            const prefix = 'pending-changes-';
            const repos = data.artifacts
              .filter(a => !a.expired && a.name.startsWith(prefix))
              .map(a => a.name.slice(prefix.length));

            core.info(`Repos with pending changes (${repos.length}): ${JSON.stringify(repos)}`);
            core.setOutput('repos', JSON.stringify(repos));
            core.setOutput('count', String(repos.length));

            if (repos.length === 0) {
              core.notice('No repos have pending changes — distribute job will be skipped.');
            }

  # ============================================================================
  # distribute: push branch & open PR for repos that have pending changes.
  # The matrix is built dynamically from `aggregate-changed.outputs.repos` so:
  #   - Repos without changes don't get a matrix cell at all (clean skip)
  #   - If the list is empty, the whole job is ⊘ Skipped (grey icon)
  # Neither case contributes to the workflow's overall failure status.
  # ============================================================================
  distribute:
    name: 'Update ${{ matrix.repo }}'
    needs: [prepare, check-changes, aggregate-changed]
    # Skip the entire job if there are no repos with pending changes. This
    # produces a real ⊘ Skipped (grey icon) status at the job level.
    if: |
      needs.aggregate-changed.result == 'success' &&
      needs.aggregate-changed.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJson(needs.aggregate-changed.outputs.repos) }}
      fail-fast: false
      max-parallel: 5
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Generate App token for target repo
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform
          repositories: ${{ matrix.repo }}

      - name: Download prepared target
        uses: actions/download-artifact@v4
        with:
          name: pending-changes-${{ matrix.repo }}
          path: .

      - name: Unpack target directory
        run: |
          mkdir -p target
          tar -xzf target.tar.gz -C target
          rm target.tar.gz

      - name: Re-point origin remote with auth token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        working-directory: target
        run: |
          # Artifact preserves the original remote URL; we replace it with an
          # authenticated URL using the freshly minted GitHub App token.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/diplodoc-platform/${{ matrix.repo }}.git"

      - name: Create pull request
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: 'diplodoc-platform/${{ matrix.repo }}'
        run: |
          BRANCH="infra/update-${VERSION}"

          # ----- Pre-flight: detect directory-file conflict in remote refs -----
          # Git stores refs as a filesystem-like tree. If a leaf ref `refs/heads/<parent>`
          # exists (e.g. `infra`), we cannot create `refs/heads/<parent>/<child>`
          # (e.g. `infra/update-v1.0.0`) — the path is occupied by a "file".
          # Fail early with a clear message instead of getting a cryptic
          # "remote rejected ... (directory file conflict)" from git push.
          #
          # NOTE: do NOT use `gh api .../git/refs/heads/<ref>` — that endpoint returns
          # 200 for both exact match AND prefix match (e.g. it returns `refs/heads/infra/*`
          # when asked about `refs/heads/infra`). We need an EXACT match only.
          # `git ls-remote` returns all matching refs as a list; we filter for the
          # exact ref name with `grep -Fxq`.
          PARENT_REF="${BRANCH%%/*}"
          if [[ "$PARENT_REF" != "$BRANCH" ]]; then
            if git ls-remote origin "refs/heads/${PARENT_REF}" 2>/dev/null \
                | awk '{print $2}' \
                | grep -Fxq "refs/heads/${PARENT_REF}"; then
              echo "::error::Repository ${REPO} has a conflicting ref 'refs/heads/${PARENT_REF}'."
              echo "::error::This blocks creation of '${BRANCH}' (git directory/file conflict)."
              echo "::error::Resolve manually, then re-run this workflow for target=${{ matrix.repo }}:"
              echo "::error::  gh api -X DELETE repos/${REPO}/git/refs/heads/${PARENT_REF}"
              exit 1
            fi
          fi

          # ----- Commit & push the branch -----
          # Create local branch on top of current HEAD (with scaffolding changes applied).
          # -B creates the branch or resets it if it exists locally.
          git checkout -B "${BRANCH}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore: update infrastructure to ${VERSION}"
          # Force push and set upstream so `gh pr create` knows the head branch.
          git push -u --force origin "${BRANCH}"

          # ----- Create PR if it doesn't exist -----
          # Note: all gh commands below use explicit --repo to avoid ambiguity in forked
          # repos (gh CLI defaults to upstream when the target repository is a fork).
          EXISTING_PR=$(gh pr list --repo "${REPO}" --head "${BRANCH}" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [[ -n "$EXISTING_PR" ]]; then
            echo "PR already exists: #${EXISTING_PR} — skipping creation."
            echo "pr_url=https://github.com/${REPO}/pull/${EXISTING_PR}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DEFAULT_BRANCH=$(gh repo view "${REPO}" --json defaultBranchRef --jq '.defaultBranchRef.name')

          # Heredoc without quotes around the delimiter to allow ${VERSION} substitution.
          # Backticks around `.infrarc.yml` are escaped to prevent command substitution.
          PR_URL=$(gh pr create \
            --repo "${REPO}" \
            --head "${BRANCH}" \
            --base "${DEFAULT_BRANCH}" \
            --title "chore: update infrastructure to ${VERSION}" \
            --body "$(cat <<BODY
          ## Automated Infrastructure Update

          This PR was automatically created by the infrastructure distribution workflow.

          **Source:** [@diplodoc/infra](https://github.com/diplodoc-platform/infra)
          **Version:** [\`${VERSION}\`](https://github.com/diplodoc-platform/infra/releases/tag/${VERSION})

          ### What changed
          Infrastructure scaffolding files have been updated to the latest version.
          This includes linting configs, CI workflows, and other shared configuration.

          See the [release notes](https://github.com/diplodoc-platform/infra/releases/tag/${VERSION}) for the full changelog.

          ---
          _If this PR breaks CI, please review the changes and adjust as needed._
          _To exclude specific files from future updates, add them to \`.infrarc.yml\` (see [docs](https://github.com/diplodoc-platform/infra#blacklist))._
          BODY
          )")

          echo "Created PR: ${PR_URL}"

          # ----- Attach label (best-effort, non-fatal) -----
          # In some repos (notably forks with disabled Issues) labels API may be
          # unavailable. We still want the PR to exist even if labelling fails.
          if gh label create "infra-auto" \
              --repo "${REPO}" \
              --color "0E8A16" \
              --description "Automated infrastructure update PR" 2>&1 | grep -v "already exists" || true; then
            :
          fi

          if ! gh pr edit "${PR_URL}" --add-label "infra-auto"; then
            echo "::warning::Could not add 'infra-auto' label to ${PR_URL}. PR was created without it."
            echo "::warning::This usually means Issues are disabled in ${REPO} (common for forks)."
          fi

      - name: Enable auto-merge
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: 'diplodoc-platform/${{ matrix.repo }}'
        run: |
          AUTO_MERGE=$(node -e "
            const yaml = require('js-yaml');
            const fs = require('fs');
            const config = yaml.load(fs.readFileSync('../distribution.yml', 'utf8'));
            const defaults = config.defaults || {};
            const repo = (config.repos || {})['${{ matrix.repo }}'] || {};
            const autoMerge = repo.auto_merge !== undefined ? repo.auto_merge : (defaults.auto_merge || false);
            console.log(autoMerge ? 'true' : 'false');
          ")

          if [[ "$AUTO_MERGE" != "true" ]]; then
            echo "Auto-merge disabled for ${REPO} (manual review required)"
            exit 0
          fi

          BRANCH="infra/update-${VERSION}"
          PR_NUMBER=$(gh pr list --repo "${REPO}" --head "${BRANCH}" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [[ -z "$PR_NUMBER" ]]; then
            echo "::warning::No PR found for ${REPO}@${BRANCH}, skipping auto-merge"
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "${REPO}" --auto --squash \
            || echo "::warning::Auto-merge not available for ${REPO} (likely missing branch protection rules)"
