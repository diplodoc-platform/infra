name: Distribute Infrastructure

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target repo name (or "all" for all repos)'
        default: 'all'
        type: string
      version:
        description: 'Version tag (auto-detected from release)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # ============================================================================
  # prepare: build the list of repos to process and resolve the version tag.
  # Output is consumed by the `distribute` matrix below.
  # ============================================================================
  prepare:
    name: Prepare repository list
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.repos.outputs.list }}
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Install latest npm (>= 11.5.1)
        run: |
          [ "$(printf '%s\n' "11.5.1" "$(npm -v)" | sort -V | head -n1)" = "11.5.1" ] || npm install -g npm@11.5.1
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build repo list
        id: repos
        run: |
          TARGET="${{ inputs.target || 'all' }}"

          if [[ "$TARGET" != "all" ]]; then
            echo "list=[\"${TARGET}\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract repo names from distribution.yml (only from repos: section)
          REPOS=$(node -e "
            const yaml = require('js-yaml');
            const fs = require('fs');
            const config = yaml.load(fs.readFileSync('distribution.yml', 'utf8'));
            const repos = Object.keys(config.repos || {});
            console.log(JSON.stringify(repos));
          ")

          echo "list=${REPOS}" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # distribute: a single matrix that does ALL the work per repo —
  # clone target, apply scaffolding, detect diff, push branch, open PR, enable
  # auto-merge. Each matrix cell ends green (✓) on either "updated" or "skipped"
  # (skip is a valid outcome). A real failure turns the cell red (✗).
  #
  # Each cell writes a tiny `status-<repo>.json` artifact with the per-repo
  # outcome; the downstream `report` job aggregates them into a markdown summary
  # table — that table is where the grey-icon "skipped" signal lives now
  # (GitHub Actions does not expose a per-cell neutral state since 2020).
  # ============================================================================
  distribute:
    name: 'Update ${{ matrix.repo }}'
    needs: prepare
    if: needs.prepare.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJson(needs.prepare.outputs.repos) }}
      fail-fast: false
      max-parallel: 5
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      REPO: 'diplodoc-platform/${{ matrix.repo }}'
    steps:
      - name: Record start time
        id: start
        run: echo "ts=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Generate App token for target repo
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform
          repositories: ${{ matrix.repo }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Install latest npm (>= 11.5.1)
        run: |
          [ "$(printf '%s\n' "11.5.1" "$(npm -v)" | sort -V | head -n1)" = "11.5.1" ] || npm install -g npm@11.5.1
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Clone target repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh repo clone diplodoc-platform/${{ matrix.repo }} target -- --depth 1
          cd target
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/diplodoc-platform/${{ matrix.repo }}.git"

      - name: Apply scaffolding
        run: |
          node bin/infra.js sync \
            --target ./target \
            --repo ${{ matrix.repo }} \
            --config ./distribution.yml

      - name: Update @diplodoc/infra version in package.json
        working-directory: target
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = '${VERSION}'.replace(/^v/, '');
            let updated = false;

            for (const depType of ['devDependencies', 'dependencies']) {
              if (pkg[depType] && pkg[depType]['@diplodoc/infra']) {
                pkg[depType]['@diplodoc/infra'] = version;
                updated = true;
              }
            }

            if (updated) {
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              console.log('Updated @diplodoc/infra to ' + version);
            } else {
              console.log('@diplodoc/infra not found in dependencies, skipping');
            }
          "

      - name: Check for changes
        id: changes
        working-directory: target
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No changes::No scaffolding changes for ${{ matrix.repo }} — nothing to distribute."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes in ${{ matrix.repo }}:"
            git diff --stat
          fi

      - name: Resolve auto-merge flag
        id: auto-merge
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          AUTO_MERGE=$(node -e "
            const yaml = require('js-yaml');
            const fs = require('fs');
            const config = yaml.load(fs.readFileSync('distribution.yml', 'utf8'));
            const defaults = config.defaults || {};
            const repo = (config.repos || {})['${{ matrix.repo }}'] || {};
            const autoMerge = repo.auto_merge !== undefined ? repo.auto_merge : (defaults.auto_merge || false);
            console.log(autoMerge ? 'true' : 'false');
          ")
          echo "value=${AUTO_MERGE}" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: pr
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="infra/update-${VERSION}"

          # ----- Pre-flight: detect directory-file conflict in remote refs -----
          # Git stores refs as a filesystem-like tree. If a leaf ref `refs/heads/<parent>`
          # exists (e.g. `infra`), we cannot create `refs/heads/<parent>/<child>`
          # (e.g. `infra/update-v1.0.0`) — the path is occupied by a "file".
          # Fail early with a clear message instead of getting a cryptic
          # "remote rejected ... (directory file conflict)" from git push.
          #
          # NOTE: do NOT use `gh api .../git/refs/heads/<ref>` — that endpoint returns
          # 200 for both exact match AND prefix match (e.g. it returns `refs/heads/infra/*`
          # when asked about `refs/heads/infra`). We need an EXACT match only.
          # `git ls-remote` returns all matching refs as a list; we filter for the
          # exact ref name with `grep -Fxq`.
          PARENT_REF="${BRANCH%%/*}"
          if [[ "$PARENT_REF" != "$BRANCH" ]]; then
            if git ls-remote origin "refs/heads/${PARENT_REF}" 2>/dev/null \
                | awk '{print $2}' \
                | grep -Fxq "refs/heads/${PARENT_REF}"; then
              echo "::error::Repository ${REPO} has a conflicting ref 'refs/heads/${PARENT_REF}'."
              echo "::error::This blocks creation of '${BRANCH}' (git directory/file conflict)."
              echo "::error::Resolve manually, then re-run this workflow for target=${{ matrix.repo }}:"
              echo "::error::  gh api -X DELETE repos/${REPO}/git/refs/heads/${PARENT_REF}"
              exit 1
            fi
          fi

          # ----- Commit & push the branch -----
          git checkout -B "${BRANCH}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore: update infrastructure to ${VERSION}"
          git push -u --force origin "${BRANCH}"

          # ----- Create PR if it doesn't exist -----
          # Note: all gh commands below use explicit --repo to avoid ambiguity in forked
          # repos (gh CLI defaults to upstream when the target repository is a fork).
          EXISTING_PR=$(gh pr list --repo "${REPO}" --head "${BRANCH}" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [[ -n "$EXISTING_PR" ]]; then
            echo "PR already exists: #${EXISTING_PR} — skipping creation."
            PR_URL="https://github.com/${REPO}/pull/${EXISTING_PR}"
            echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
            echo "pr_number=${EXISTING_PR}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DEFAULT_BRANCH=$(gh repo view "${REPO}" --json defaultBranchRef --jq '.defaultBranchRef.name')

          PR_URL=$(gh pr create \
            --repo "${REPO}" \
            --head "${BRANCH}" \
            --base "${DEFAULT_BRANCH}" \
            --title "chore: update infrastructure to ${VERSION}" \
            --body "$(cat <<BODY
          ## Automated Infrastructure Update

          This PR was automatically created by the infrastructure distribution workflow.

          **Source:** [@diplodoc/infra](https://github.com/diplodoc-platform/infra)
          **Version:** [\`${VERSION}\`](https://github.com/diplodoc-platform/infra/releases/tag/${VERSION})

          ### What changed
          Infrastructure scaffolding files have been updated to the latest version.
          This includes linting configs, CI workflows, and other shared configuration.

          See the [release notes](https://github.com/diplodoc-platform/infra/releases/tag/${VERSION}) for the full changelog.

          ---
          _If this PR breaks CI, please review the changes and adjust as needed._
          _To exclude specific files from future updates, add them to \`.infrarc.yml\` (see [docs](https://github.com/diplodoc-platform/infra#blacklist))._
          BODY
          )")

          echo "Created PR: ${PR_URL}"
          PR_NUMBER=$(echo "${PR_URL}" | awk -F/ '{print $NF}')
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

          # ----- Attach label (best-effort, non-fatal) -----
          # In some repos (notably forks with disabled Issues) labels API may be
          # unavailable. We still want the PR to exist even if labelling fails.
          if gh label create "infra-auto" \
              --repo "${REPO}" \
              --color "0E8A16" \
              --description "Automated infrastructure update PR" 2>&1 | grep -v "already exists" || true; then
            :
          fi

          if ! gh pr edit "${PR_URL}" --add-label "infra-auto"; then
            echo "::warning::Could not add 'infra-auto' label to ${PR_URL}. PR was created without it."
            echo "::warning::This usually means Issues are disabled in ${REPO} (common for forks)."
          fi

      - name: Enable auto-merge
        id: automerge
        if: steps.changes.outputs.has_changes == 'true' && steps.auto-merge.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.pr_number }}"
          if [[ -z "$PR_NUMBER" ]]; then
            echo "::warning::No PR number recorded, skipping auto-merge"
            exit 0
          fi

          if gh pr merge "$PR_NUMBER" --repo "${REPO}" --auto --rebase; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Auto-merge not available for ${REPO} (likely missing branch protection rules)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # Always write a tiny status-<repo>.json artifact, even on failure. This is
      # the only channel the `report` job reads to build the summary table.
      # Schema:
      #   {
      #     "repo": "<name>",
      #     "status": "updated" | "skipped" | "failed",
      #     "pr_url"?: string,
      #     "pr_number"?: string,
      #     "auto_merge"?: "true" | "false",
      #     "auto_merge_enabled"?: "true" | "false",
      #     "duration_s": number,
      #     "started_at": "<ISO-8601>"
      #   }
      - name: Write status artifact payload
        id: status
        if: always()
        env:
          STARTED_TS: ${{ steps.start.outputs.ts }}
          HAS_CHANGES: ${{ steps.changes.outputs.has_changes }}
          AUTO_MERGE: ${{ steps.auto-merge.outputs.value }}
          AUTO_MERGE_ENABLED: ${{ steps.automerge.outputs.enabled }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p .status
          NOW_TS=$(date -u +%s)
          STARTED_TS_SAFE="${STARTED_TS:-$NOW_TS}"
          DURATION=$(( NOW_TS - STARTED_TS_SAFE ))
          STARTED_AT=$(date -u -d "@${STARTED_TS_SAFE}" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -r "${STARTED_TS_SAFE}" +%Y-%m-%dT%H:%M:%SZ)

          # Pick status based on job state and detected changes.
          # `job.status` is 'success' | 'failure' | 'cancelled' at this point.
          if [[ "${JOB_STATUS}" != "success" ]]; then
            STATUS="failed"
          elif [[ "${HAS_CHANGES}" == "true" ]]; then
            STATUS="updated"
          else
            STATUS="skipped"
          fi

          node -e "
            const fs = require('fs');
            const payload = {
              repo: '${{ matrix.repo }}',
              status: '${STATUS}',
              duration_s: Number('${DURATION}') || 0,
              started_at: '${STARTED_AT}',
            };
            if (process.env.PR_URL) payload.pr_url = process.env.PR_URL;
            if (process.env.PR_NUMBER) payload.pr_number = process.env.PR_NUMBER;
            if (process.env.AUTO_MERGE) payload.auto_merge = process.env.AUTO_MERGE;
            if (process.env.AUTO_MERGE_ENABLED) payload.auto_merge_enabled = process.env.AUTO_MERGE_ENABLED;
            fs.writeFileSync('.status/status-${{ matrix.repo }}.json', JSON.stringify(payload, null, 2));
            console.log(JSON.stringify(payload));
          "

      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ matrix.repo }}
          path: .status/status-${{ matrix.repo }}.json
          retention-days: 1
          if-no-files-found: error

  # ============================================================================
  # report: aggregate per-repo status artifacts into a single markdown summary
  # table written to $GITHUB_STEP_SUMMARY. Runs even if some distribute cells
  # failed (`if: always()`). Marks the run as failed (`core.setFailed`) only
  # when at least one repo ended in `failed` state.
  #
  # This table is where the "Skipped" signal lives now — per-cell grey icons
  # are not achievable in GitHub Actions (no neutral exit since 2020), so the
  # rich summary replaces them with explicit ⊘ rows including PR links,
  # durations and reasons.
  # ============================================================================
  report:
    name: Build distribution report
    needs: [prepare, distribute]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all status artifacts
        uses: actions/download-artifact@v4
        with:
          path: .status
          pattern: status-*
          merge-multiple: true

      - name: Render summary table
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REPOS_JSON: ${{ needs.prepare.outputs.repos }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const version = process.env.VERSION || '';
            const allRepos = JSON.parse(process.env.REPOS_JSON || '[]');

            // Read every status-<repo>.json file downloaded into .status/
            const statusDir = '.status';
            const statuses = new Map(); // repo -> payload
            if (fs.existsSync(statusDir)) {
              for (const name of fs.readdirSync(statusDir)) {
                if (!name.startsWith('status-') || !name.endsWith('.json')) continue;
                try {
                  const raw = fs.readFileSync(path.join(statusDir, name), 'utf8');
                  const data = JSON.parse(raw);
                  if (data && data.repo) statuses.set(data.repo, data);
                } catch (err) {
                  core.warning(`Failed to parse ${name}: ${err.message}`);
                }
              }
            }

            // Repos that ended without any status artifact at all are treated
            // as failed (typically: matrix cell crashed before reaching the
            // "Write status artifact payload" step, or upload failed).
            const rows = allRepos.map((repo) => {
              const s = statuses.get(repo);
              if (!s) {
                return {
                  repo,
                  status: 'failed',
                  reason: 'no status artifact produced',
                };
              }
              return s;
            });

            const fmtDuration = (s) => {
              if (typeof s !== 'number' || !Number.isFinite(s) || s < 0) return '—';
              const m = Math.floor(s / 60);
              const sec = s % 60;
              return m > 0 ? `${m}m ${sec}s` : `${sec}s`;
            };

            const icons = {
              updated: '✅ Updated',
              skipped: '⊘ Skipped',
              failed: '❌ Failed',
            };

            const counts = { updated: 0, skipped: 0, failed: 0 };
            for (const r of rows) counts[r.status] = (counts[r.status] || 0) + 1;

            // Per-repo annotations for quick UI scanning.
            for (const r of rows) {
              const head = `[${r.repo}]`;
              if (r.status === 'updated') {
                const pr = r.pr_url ? ` — ${r.pr_url}` : '';
                const am = r.auto_merge === 'true'
                  ? (r.auto_merge_enabled === 'true' ? ' (auto-merge enabled)' : ' (auto-merge requested but not enabled)')
                  : '';
                core.notice(`${head} ✅ Updated${pr}${am}`);
              } else if (r.status === 'skipped') {
                core.notice(`${head} ⊘ Skipped — no scaffolding changes`);
              } else {
                const reason = r.reason ? ` — ${r.reason}` : '';
                core.error(`${head} ❌ Failed${reason}`);
              }
            }

            // Sort: failed first, then updated, then skipped — alpha within group.
            const order = { failed: 0, updated: 1, skipped: 2 };
            rows.sort((a, b) => {
              const oa = order[a.status] ?? 99;
              const ob = order[b.status] ?? 99;
              if (oa !== ob) return oa - ob;
              return a.repo.localeCompare(b.repo);
            });

            const formatRow = (r) => {
              const status = icons[r.status] || r.status;
              const pr = r.pr_url
                ? `[#${r.pr_number || '?'}](${r.pr_url})`
                : '—';
              let am = '—';
              if (r.auto_merge === 'true') {
                am = r.auto_merge_enabled === 'true' ? '✅ enabled' : '⚠️ requested';
              } else if (r.auto_merge === 'false') {
                am = 'off';
              }
              const dur = fmtDuration(r.duration_s);
              return `| \`${r.repo}\` | ${status} | ${pr} | ${am} | ${dur} |`;
            };

            const title = version
              ? `Distribution summary — ${version}`
              : 'Distribution summary';

            const lines = [
              `## ${title}`,
              '',
              `Total: **${rows.length}** · ✅ Updated: **${counts.updated || 0}** · ⊘ Skipped: **${counts.skipped || 0}** · ❌ Failed: **${counts.failed || 0}**`,
              '',
              '| Repo | Status | PR | Auto-merge | Duration |',
              '| --- | --- | --- | --- | --- |',
              ...rows.map(formatRow),
            ];

            await core.summary.addRaw(lines.join('\n')).write();

            if ((counts.failed || 0) > 0) {
              core.setFailed(`${counts.failed} repo(s) failed to distribute. See the summary table above.`);
            }
