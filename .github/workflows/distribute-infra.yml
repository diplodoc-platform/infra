name: Distribute Infrastructure

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target repo name (or "all" for all repos)'
        default: 'all'
        type: string
      version:
        description: 'Version tag (auto-detected from release)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare repository list
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.repos.outputs.list }}
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Install latest npm (>= 11.5.1)
        run: |
          [ "$(printf '%s\n' "11.5.1" "$(npm -v)" | sort -V | head -n1)" = "11.5.1" ] || npm install -g npm@11.5.1
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build repo list
        id: repos
        run: |
          TARGET="${{ inputs.target || 'all' }}"

          if [[ "$TARGET" != "all" ]]; then
            echo "list=[\"${TARGET}\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract repo names from distribution.yml (only from repos: section)
          REPOS=$(node -e "
            const yaml = require('js-yaml');
            const fs = require('fs');
            const config = yaml.load(fs.readFileSync('distribution.yml', 'utf8'));
            const repos = Object.keys(config.repos || {});
            console.log(JSON.stringify(repos));
          ")

          echo "list=${REPOS}" >> "$GITHUB_OUTPUT"

  distribute:
    name: 'Update ${{ matrix.repo }}'
    needs: prepare
    if: needs.prepare.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJson(needs.prepare.outputs.repos) }}
      fail-fast: false
      max-parallel: 5
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Generate App token for target repo
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform
          repositories: ${{ matrix.repo }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Install latest npm (>= 11.5.1)
        run: |
          [ "$(printf '%s\n' "11.5.1" "$(npm -v)" | sort -V | head -n1)" = "11.5.1" ] || npm install -g npm@11.5.1
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Clone target repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh repo clone diplodoc-platform/${{ matrix.repo }} target -- --depth 1
          cd target
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/diplodoc-platform/${{ matrix.repo }}.git"

      - name: Apply scaffolding
        run: |
          node bin/infra.js sync \
            --target ./target \
            --repo ${{ matrix.repo }} \
            --config ./distribution.yml

      - name: Update @diplodoc/infra version in package.json
        working-directory: target
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = '${VERSION}'.replace(/^v/, '');
            let updated = false;

            for (const depType of ['devDependencies', 'dependencies']) {
              if (pkg[depType]) {
                if (pkg[depType]['@diplodoc/infra']) {
                  pkg[depType]['@diplodoc/infra'] = version;
                  updated = true;
                }
                // Migration: replace @diplodoc/lint with @diplodoc/infra
                if (pkg[depType]['@diplodoc/lint']) {
                  delete pkg[depType]['@diplodoc/lint'];
                  pkg[depType]['@diplodoc/infra'] = version;
                  updated = true;
                }
              }
            }

            if (updated) {
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              console.log('Updated @diplodoc/infra to ' + version);
            } else {
              console.log('@diplodoc/infra not found in dependencies, skipping');
            }
          "

      # ============================================================================
      # === BEGIN MIGRATION: @diplodoc/lint → @diplodoc/infra (REMOVE AFTER DONE) ===
      # ============================================================================
      # Temporary one-shot rewrite of legacy package references in consumer source
      # files (e.g. `esbuild/build.mjs` imports `@diplodoc/lint/esbuild`). Scaffolding
      # files are already shipped with the new name; this step only touches files
      # that are NOT managed by scaffolding (custom build scripts, helpers, etc.).
      #
      # Remove this step once `MIGRATION.md` § Cleanup is complete and no consumer
      # repository contains the legacy reference. See MIGRATION.md for the checklist.
      # ============================================================================
      - name: 'MIGRATION: Replace legacy @diplodoc/lint references in source files'
        working-directory: target
        run: |
          set -euo pipefail

          FILES=$(grep -rl '@diplodoc/lint' . \
            --include='*.mjs' \
            --include='*.cjs' \
            --include='*.js' \
            --include='*.ts' \
            --include='*.tsx' \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=dist \
            --exclude-dir=lib \
            --exclude-dir=coverage \
            || true)

          if [[ -z "$FILES" ]]; then
            echo "No legacy @diplodoc/lint references found — migration step is a no-op."
            exit 0
          fi

          echo "Rewriting @diplodoc/lint → @diplodoc/infra in:"
          echo "$FILES"
          echo "$FILES" | xargs sed -i 's|@diplodoc/lint|@diplodoc/infra|g'
      # ============================================================================
      # === END MIGRATION ==========================================================
      # ============================================================================

      - name: Check for changes
        id: changes
        working-directory: target
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes in ${{ matrix.repo }}:"
            git diff --stat
          fi

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: 'diplodoc-platform/${{ matrix.repo }}'
        run: |
          BRANCH="infra/update-${VERSION}"

          # ----- Pre-flight: detect directory-file conflict in remote refs -----
          # Git stores refs as a filesystem-like tree. If a leaf ref `refs/heads/<parent>`
          # exists (e.g. `infra`), we cannot create `refs/heads/<parent>/<child>`
          # (e.g. `infra/update-v1.0.0`) — the path is occupied by a "file".
          # Fail early with a clear message instead of getting a cryptic
          # "remote rejected ... (directory file conflict)" from git push.
          PARENT_REF="${BRANCH%%/*}"
          if [[ "$PARENT_REF" != "$BRANCH" ]]; then
            if gh api "repos/${REPO}/git/refs/heads/${PARENT_REF}" >/dev/null 2>&1; then
              echo "::error::Repository ${REPO} has a conflicting ref 'refs/heads/${PARENT_REF}'."
              echo "::error::This blocks creation of '${BRANCH}' (git directory/file conflict)."
              echo "::error::Resolve manually, then re-run this workflow for target=${{ matrix.repo }}:"
              echo "::error::  gh api -X DELETE repos/${REPO}/git/refs/heads/${PARENT_REF}"
              exit 1
            fi
          fi

          # ----- Commit & push the branch -----
          # Create local branch on top of current HEAD (with scaffolding changes applied).
          # -B creates the branch or resets it if it exists locally.
          git checkout -B "${BRANCH}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore: update infrastructure to ${VERSION}"
          # Force push and set upstream so `gh pr create` knows the head branch.
          git push -u --force origin "${BRANCH}"

          # ----- Create PR if it doesn't exist -----
          # Note: all gh commands below use explicit --repo to avoid ambiguity in forked
          # repos (gh CLI defaults to upstream when the target repository is a fork).
          EXISTING_PR=$(gh pr list --repo "${REPO}" --head "${BRANCH}" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [[ -n "$EXISTING_PR" ]]; then
            echo "PR already exists: #${EXISTING_PR} — skipping creation."
            echo "pr_url=https://github.com/${REPO}/pull/${EXISTING_PR}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DEFAULT_BRANCH=$(gh repo view "${REPO}" --json defaultBranchRef --jq '.defaultBranchRef.name')

          # Heredoc without quotes around the delimiter to allow ${VERSION} substitution.
          # Backticks around `.infrarc.yml` are escaped to prevent command substitution.
          PR_URL=$(gh pr create \
            --repo "${REPO}" \
            --head "${BRANCH}" \
            --base "${DEFAULT_BRANCH}" \
            --title "chore: update infrastructure to ${VERSION}" \
            --body "$(cat <<BODY
          ## Automated Infrastructure Update

          This PR was automatically created by the infrastructure distribution workflow.

          **Source:** [@diplodoc/infra](https://github.com/diplodoc-platform/infra)
          **Version:** [\`${VERSION}\`](https://github.com/diplodoc-platform/infra/releases/tag/${VERSION})

          ### What changed
          Infrastructure scaffolding files have been updated to the latest version.
          This includes linting configs, CI workflows, and other shared configuration.

          See the [release notes](https://github.com/diplodoc-platform/infra/releases/tag/${VERSION}) for the full changelog.

          ---
          _If this PR breaks CI, please review the changes and adjust as needed._
          _To exclude specific files from future updates, add them to \`.infrarc.yml\` (see [docs](https://github.com/diplodoc-platform/infra#blacklist))._
          BODY
          )")

          echo "Created PR: ${PR_URL}"

          # ----- Attach label (best-effort, non-fatal) -----
          # In some repos (notably forks with disabled Issues) labels API may be
          # unavailable. We still want the PR to exist even if labelling fails.
          if gh label create "infra-auto" \
              --repo "${REPO}" \
              --color "0E8A16" \
              --description "Automated infrastructure update PR" 2>&1 | grep -v "already exists" || true; then
            :
          fi

          if ! gh pr edit "${PR_URL}" --add-label "infra-auto"; then
            echo "::warning::Could not add 'infra-auto' label to ${PR_URL}. PR was created without it."
            echo "::warning::This usually means Issues are disabled in ${REPO} (common for forks)."
          fi

      - name: Enable auto-merge
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: 'diplodoc-platform/${{ matrix.repo }}'
        run: |
          AUTO_MERGE=$(node -e "
            const yaml = require('js-yaml');
            const fs = require('fs');
            const config = yaml.load(fs.readFileSync('../distribution.yml', 'utf8'));
            const defaults = config.defaults || {};
            const repo = (config.repos || {})['${{ matrix.repo }}'] || {};
            const autoMerge = repo.auto_merge !== undefined ? repo.auto_merge : (defaults.auto_merge || false);
            console.log(autoMerge ? 'true' : 'false');
          ")

          if [[ "$AUTO_MERGE" != "true" ]]; then
            echo "Auto-merge disabled for ${REPO} (manual review required)"
            exit 0
          fi

          BRANCH="infra/update-${VERSION}"
          PR_NUMBER=$(gh pr list --repo "${REPO}" --head "${BRANCH}" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [[ -z "$PR_NUMBER" ]]; then
            echo "::warning::No PR found for ${REPO}@${BRANCH}, skipping auto-merge"
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "${REPO}" --auto --squash \
            || echo "::warning::Auto-merge not available for ${REPO} (likely missing branch protection rules)"
