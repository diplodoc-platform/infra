name: Integration Test

on:
  pull_request:
    paths:
      - 'scaffolding/**'
      - '*-config.js'
      - 'bin/**'
      - 'scripts/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  test-on-consumers:
    name: 'Test on ${{ matrix.repo }}'
    strategy:
      matrix:
        repo: [cli, transform, cut-extension]
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.YC_UI_BOT_GITHUB_TOKEN }}
    steps:
      - name: Checkout infra (PR branch)
        uses: actions/checkout@v4

      - name: Setup Node.js and install infra dependencies
        uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: ''

      - name: Clone target repository
        run: gh repo clone diplodoc-platform/${{ matrix.repo }} target -- --depth 1

      - name: Apply scaffolding from PR branch
        run: |
          node bin/infra.js sync \
            --target ./target \
            --repo ${{ matrix.repo }} \
            --config ./distribution.yml

      - name: Install target dependencies
        working-directory: target
        run: npm ci

      - name: Run lint
        working-directory: target
        run: npm run lint

      - name: Run typecheck
        working-directory: target
        run: npm run typecheck

      - name: Run build
        working-directory: target
        run: npm run build

      - name: Run tests
        working-directory: target
        run: npm run test

  diff-report:
    name: Generate diff report
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.YC_UI_BOT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: ''

      - name: Generate dry-run report
        run: |
          node bin/infra.js sync \
            --dry-run \
            --all \
            --config ./distribution.yml \
            --output diff-report.md

      - name: Post report as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('diff-report.md', 'utf8');
            } catch {
              report = '_No diff report generated._';
            }

            const body = `## Infrastructure Diff Report\n\n${report}\n\n---\n_Auto-generated by integration-test workflow_`;

            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body?.includes('## Infrastructure Diff Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
