name: Dependency Auto-merge Audit

# Auto-merge workflow for Dependabot PRs (T10.2).
#
# This is an infra-only workflow (NOT distributed via scaffolding) that
# evaluates open Dependabot PRs across all 28 repositories against the 9
# strict auto-merge conditions defined in T10.1.
#
# Stabilization gating:
#   - There is intentionally no schedule. Every evaluation is started manually
#     while testpack and the downstream checks are being stabilized.
#   - Every dispatch is DRY-RUN: it produces an audit log but cannot merge PRs.
#   - Adding a schedule later requires a separate reviewed change after the
#     manual validation period.

on:
  workflow_dispatch:
    inputs:
      publish_issue:
        description: 'Create or update the audit tracking issue'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  auto-merge:
    name: Audit Dependabot PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: Ensure supported npm and install trusted infra dependencies
        shell: bash
        run: |
          REQUIRED_NPM=11.5.1
          if [ "$(printf '%s\n' "$REQUIRED_NPM" "$(npm -v)" | sort -V | head -n1)" != "$REQUIRED_NPM" ]; then
            npm install --prefix "$RUNNER_TEMP/npm-global" -g "npm@$REQUIRED_NPM"
            echo "$RUNNER_TEMP/npm-global/bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/npm-global/bin:$PATH"
          fi
          npm ci --ignore-scripts

      - name: Generate App token (org-wide)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform

      - name: Run dry-run evaluation
        id: automerge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p .status
          set +e
          node scripts/auto-merge.js \
            --all \
            --output .status/auto-merge-audit.json \
            --markdown .status/auto-merge-audit.md
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-merge-audit
          path: .status/auto-merge-audit.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Post audit log as tracking issue
        if: always() && inputs.publish_issue == true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ ! -f .status/auto-merge-audit.md ]; then
            echo "No audit file found, skipping issue post."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          TITLE="Auto-merge Audit Log — ${DATE}"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --search "${TITLE} in:title" --state open --json number --limit 1 2>/dev/null || echo "")
          BODY=$(cat .status/auto-merge-audit.md)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "[]" ]; then
            NUMBER=$(echo "$EXISTING" | jq -r '.[0].number')
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "Updated existing issue #$NUMBER"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body "$BODY" \
              --label "dependency-health,auto-merge"
            echo "Created new audit issue"
          fi

      - name: Write job summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./scripts/workflows/dependency-auto-merge-summary.js');
            await run({github, context, core});

      - name: Fail on merge errors
        if: steps.automerge.outputs.exit-code != '0'
        run: |
          echo "::error::Auto-merge audit encountered errors. See the audit log artifact and job summary."
          exit 1
