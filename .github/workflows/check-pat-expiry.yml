name: Check Approver PAT Expiry

# Monitors the machine user's fine-grained PAT (INFRA_APPROVER_PAT, owned by
# diplodoc-bot) and alerts ahead of expiry. GitHub has no API to regenerate a
# fine-grained PAT, so this only detects + alerts; rotation stays manual (see
# ADR-001 Operational Notes and ADR-002).

on:
  schedule:
    # Two reminders tied to the CURRENT INFRA_APPROVER_PAT expiry (2027-05-17):
    #   - ~2 weeks before  -> May 3
    #   - ~3 days before   -> May 14
    # These dates are relative to the current expiry. After each rotation, update
    # both cron lines (and this comment) to the new expiry date minus 14 / 3 days.
    # The job still gates on the threshold, so it only alerts when actually near.
    - cron: '0 7 3 5 *'
    - cron: '0 7 14 5 *'
  workflow_dispatch:
    inputs:
      threshold_days:
        description: 'Alert when fewer than this many days remain'
        default: '14'
        type: string

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check PAT expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js and npm
        uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: ''
          run-install: 'false'

      - name: Install trusted infra dependencies without lifecycle scripts
        shell: bash
        run: npm ci --ignore-scripts

      - name: Generate App token (org-level)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform

      - name: Evaluate PAT expiry
        id: check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_THRESHOLD_DAYS: ${{ inputs.threshold_days || '14' }}
        run: |
          mkdir -p .status
          node scripts/check-pat-expiry.js --output .status/pat-expiry.json

      - name: Alert on upcoming/expired PAT
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./scripts/workflows/pat-expiry-alert.js');
            await run({github, context, core});
