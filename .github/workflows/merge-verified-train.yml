name: Merge Verified Dependency Train
run-name: "${{ inputs.dry_run && 'Preview' || 'Merge' }} candidates #${{ inputs.candidate_pr }} · request ${{ inputs.request_check_id || 'manual' }}"

on:
  workflow_dispatch:
    inputs:
      candidate_pr:
        description: 'Temporary CLI candidate PR number'
        type: number
        required: true
      dry_run:
        description: 'Preview all gates without merging'
        type: boolean
        default: true
      request_check_id:
        description: 'App authorization receipt; leave empty for a direct human dispatch'
        type: string
        default: ''
      confirm_train_id:
        description: 'For a live manual merge, paste the exact verified train ID'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: dependency-candidate-train
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      ((!endsWith(github.actor, '[bot]') && github.actor != 'diplodoc-bot' && github.actor != 'yc-ui-bot') ||
      (github.actor == 'diplodoc-app[bot]' && inputs.request_check_id != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      repositories: ${{ steps.preview.outputs.repositories }}
      train-id: ${{ steps.preview.outputs.train-id }}
      read-repositories: ${{ steps.inventory.outputs.read-repositories }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          run-install: 'false'
          cache: ''
      - run: npm ci --ignore-scripts
      - id: candidate-reader
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform
          repositories: cli
          permission-contents: read
          permission-checks: read
          permission-pull-requests: read
      - id: inventory
        env:
          GH_TOKEN: ${{ steps.candidate-reader.outputs.token }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
        run: node scripts/candidate-train/merge.js inventory
      - id: reader
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform
          repositories: ${{ steps.inventory.outputs.read-repositories }}
          permission-contents: read
          permission-checks: read
          permission-pull-requests: read
          permission-administration: read
      - id: preview
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          REQUEST_CHECK_ID: ${{ inputs.request_check_id }}
          REQUEST_ACTION: ${{ inputs.dry_run && 'preview' || 'merge' }}
          DEPENDENCY_TRAIN_MERGE_APPROVED: 'false'
        run: node scripts/candidate-train/merge.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-train-merge-preview
          path: merge-progress.json
          if-no-files-found: ignore

  merge:
    needs: preview
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.dry_run == false &&
      inputs.confirm_train_id == needs.preview.outputs.train-id
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      candidate-sha: ${{ steps.merge.outputs.candidate-sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          run-install: 'false'
          cache: ''
      - run: npm ci --ignore-scripts
      - id: reader
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform
          repositories: ${{ needs.preview.outputs.read-repositories }}
          permission-contents: read
          permission-checks: read
          permission-pull-requests: read
          permission-administration: read
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform
          repositories: ${{ needs.preview.outputs.repositories }}
      - name: Recheck the entire group and merge the exact heads
        id: merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_READ_TOKEN: ${{ steps.reader.outputs.token }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          REQUEST_CHECK_ID: ${{ inputs.request_check_id }}
          REQUEST_ACTION: ${{ inputs.dry_run && 'preview' || 'merge' }}
          CONFIRM_TRAIN_ID: ${{ inputs.confirm_train_id }}
          DEPENDENCY_TRAIN_MERGE_APPROVED: 'true'
          DEPENDENCY_TRAIN_MAX_RISK: ${{ vars.DEPENDENCY_TRAIN_MAX_RISK || 'low' }}
        run: node scripts/candidate-train/merge.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-train-merge-progress
          path: merge-progress.json
          retention-days: 90
          if-no-files-found: error

  dispatch-submodules:
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-id: ${{ steps.dispatch.outputs.run-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: dispatcher
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform
          repositories: diplodoc
          permission-actions: write
      - name: Start Update Submodules on metapackage master
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.dispatcher.outputs.token }}
        run: node scripts/candidate-train/submodules.js dispatch

  finish:
    needs: [preview, merge, dispatch-submodules]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: observer
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform
          repositories: diplodoc
          permission-actions: read
      - name: Wait for the dispatched Update Submodules run
        env:
          GH_TOKEN: ${{ steps.observer.outputs.token }}
          SUBMODULES_RUN_ID: ${{ needs.dispatch-submodules.outputs.run-id }}
        run: node scripts/candidate-train/submodules.js wait
      - id: cli
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform
          repositories: cli
          permission-pull-requests: write
      - name: Close the verified temporary CLI PR
        env:
          GH_TOKEN: ${{ steps.cli.outputs.token }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          CANDIDATE_SHA: ${{ needs.merge.outputs.candidate-sha }}
          TRAIN_ID: ${{ needs.preview.outputs.train-id }}
        run: node scripts/candidate-train/submodules.js close
