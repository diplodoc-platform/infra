    verification-profile: document-rendering
    reason: 'SVGO 4.1.0 requires the maintained maxEntityCount patch and an isolated Node bundle for large draw.io SVG metadata'
    evidence:
      upstream-issue: https://github.com/svg/svgo/issues/2218
      upstream-patch: https://github.com/svg/svgo/pull/2224
    owner: diplodoc-platform/team
    introduced-at: 2026-06-21
    review-after: 2026-12-01
    expires-at: 2026-12-01
    exit-criteria:
      - Upstream releases configurable entity limits for the Node entry points
      - Counted-entity regressions pass in Transform and CLI HTML and Markdown builds
      - The packed npm artifact works without the local patch

