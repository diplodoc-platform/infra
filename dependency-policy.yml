# ============================================================================
# Diplodoc Dependency Policy Registry
# ============================================================================
# Canonical single source of truth for known dependency constraints.
# Every exact pin in package.json MUST have a corresponding entry here.
# Indefinite exceptions are prohibited — every entry has an expires-at.
#
# Schema (mandatory fields per entry):
#   id                   Unique identifier (DEP-NNNN)
#   dependency           npm package name
#   repositories         List of repos where the constraint applies
#   allowed-version      Exact permitted version (except managed-infra pins below)
#   pin-policy           managed-infra: scoped dev-only release pins, not version ignores
#   ignored-versions     Specific proven problematic versions (no open ranges)
#   risk                 low | medium | high | critical
#   category             Free-form category (e.g. output-regression, security)
#   verification-profile Profile used to verify an update is safe
#   reason               Human-readable reason for the constraint
#   evidence             Object with links proving the problem
#   owner                Responsible team/owner
#   introduced-at        ISO date the constraint was introduced
#   review-after         ISO date to revisit the constraint
#   expires-at           ISO date after which the constraint is invalid (no indefinite)
#   exit-criteria        List of conditions that must hold to remove the constraint
#
# Security exceptions additionally require:
#   security-assessment    Description of the vulnerability/risk assessment
#   compensating-measures  Measures mitigating the risk while the exception holds
# ============================================================================

schema-version: '1.0'
registry-owner: diplodoc-platform/infra
